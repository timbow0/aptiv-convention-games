<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aptiv Convention Games</title>
  <style>
    :root {
      --bg: #f3f6f7;
      --navy: #1a1a2e;
      --orange: #f84018;
      --text: #171d26;
      --muted: #5b6773;
      --card: #ffffff;
      --line: #dfe7ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eef2f3, #f9fbfc 30%, #f3f6f7);
      color: var(--text);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 32px 18px 50px; }
    .top {
      background: var(--navy);
      color: white;
      border-radius: 20px;
      padding: 24px 22px 18px;
      box-shadow: 0 10px 24px rgba(26,26,46,.18);
    }
    .logo {
      font-weight: 900;
      font-size: clamp(28px, 3vw, 42px);
      letter-spacing: 2px;
      margin: 0 0 8px;
    }
    .logo span { color: var(--orange); }
    .subtitle {
      color: #dfeaf0;
      font-size: 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin-top: 26px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(17,17,17,.06);
      padding: 22px;
    }
    .eyebrow {
      color: var(--orange);
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 900;
      margin-bottom: 8px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.1;
    }
    p {
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 16px;
    }
    .button {
      display: inline-block;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: transform .15s ease;
    }
    .button:hover { transform: translateY(-1px); }
    .primary { background: var(--orange); color: white; }
    .secondary { background: #edf3f4; color: var(--navy); }
    .qrbox {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 14px;
      padding: 14px;
      background: #f7f9fa;
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .qrbox img {
      width: min(220px, 78vw);
      height: auto;
      display: block;
    }
    @media (max-width: 640px) {
      .top { padding: 18px 16px; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="logo"><span>APTIV</span> Games</div>
      <div class="subtitle">Convention event access</div>
    </header>

    <div class="grid">
      <section class="card">
        <div class="eyebrow">Game 1</div>
        <h2>Wiring Academy</h2>
        <p>Ein interaktives Lernspiel zu Stromkreisen, Sensorik und Schaltsystemen.</p>
        <a class="button primary" href="spiel1.html" target="_blank" rel="noopener">Spiel 1 öffnen</a>
        <div class="qrbox">
          <img alt="QR Code to Spiel 1" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://timbow0.github.io/aptiv-convention-games/spiel1.html" />
        </div>
      </section>

      <section class="card">
        <div class="eyebrow">Game 2</div>
        <h2>Bereichs-Finder</h2>
        <p>Ein Orientierungsspiel zur Auswahl passender Fachbereiche für die Ausbildungsmesse.</p>
        <a class="button primary" href="spiel2.html" target="_blank" rel="noopener">Spiel 2 öffnen</a>
        <div class="qrbox">
          <img alt="QR Code to Spiel 2" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://timbow0.github.io/aptiv-convention-games/spiel2.html" />
        </div>
      </section>
    </div>
  </div>
</body>
</html>
