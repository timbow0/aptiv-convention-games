<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1A1A2E"><title>Aptiv Bereichs-Finder</title><style>
:root{--orange:#F84018;--dark:#1A1A2E;--green:#7AC143;--blue:#B7D1CF;--paper:#F3F6F7;--white:#fff;--ink:#161622;--muted:#657076;--line:#DCE3E5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--dark);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}button{font:inherit}body{display:flex;justify-content:center}.app{width:min(100%,520px);min-height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow-x:hidden}.top{background:var(--dark);color:#fff;padding:max(14px,env(safe-area-inset-top)) 17px 13px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;letter-spacing:2px;font-size:20px}.logo i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin:0 5px 2px}.tag{font-size:10px;color:var(--blue);text-align:right}.bar{height:7px;background:#35354c;border-radius:99px;margin-top:11px;overflow:hidden}.bar span{display:block;height:100%;background:var(--orange);transition:.3s}.main{padding:15px;flex:1}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 24px #1112;margin-bottom:13px}.eyebrow{font-size:11px;font-weight:900;color:var(--orange);text-transform:uppercase;letter-spacing:1px}h1{font-size:27px;line-height:1.08;margin:7px 0 10px}h2{font-size:21px;line-height:1.18;margin:5px 0 10px}p{line-height:1.45;margin:8px 0}.small{font-size:12px;color:var(--muted)}.btn{width:100%;min-height:52px;border:0;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:900;background:var(--orange);color:#fff;cursor:pointer;margin-top:10px}.btn.dark{background:var(--dark)}.btn.light{background:#E9EEF0;color:var(--dark)}.btn:disabled{opacity:.45}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.chip{font-size:12px;padding:6px 9px;border-radius:99px;background:#E8EDEF}.answers{display:grid;gap:10px;margin-top:15px}.answer{width:100%;min-height:58px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:12px;text-align:left;font-weight:750;line-height:1.3;display:flex;gap:11px;align-items:center;cursor:pointer}.answer:active{transform:scale(.988)}.letter{width:31px;height:31px;flex:0 0 31px;border-radius:10px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:900}.kind{display:inline-block;font-size:11px;font-weight:900;color:#fff;background:var(--dark);border-radius:99px;padding:5px 9px;margin-bottom:8px}.counter{font-size:12px;color:var(--blue);font-weight:800}.resultHero{background:linear-gradient(145deg,var(--dark),#30304d);color:#fff}.resultHero .eyebrow{color:var(--blue)}.profile{font-size:30px;font-weight:900;color:#fff;margin:8px 0}.topArea{display:flex;gap:12px;align-items:center;margin:15px 0;padding:12px;border-radius:15px;background:#F1F5F5}.rank{width:44px;height:44px;border-radius:13px;background:var(--orange);color:white;display:grid;place-items:center;font-size:21px;font-weight:900;flex:0 0 44px}.areaName{font-size:18px;font-weight:900}.scorebar{height:8px;border-radius:99px;background:#DDE5E6;margin-top:6px;overflow:hidden}.scorebar span{height:100%;display:block;background:var(--green)}.traits{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.trait{background:#EDF2F3;border-radius:12px;text-align:center;padding:9px 4px;font-size:11px;font-weight:800}.notice{border-left:5px solid var(--blue);padding:10px 12px;background:#EDF3F3;border-radius:8px;margin-top:12px}.footer{padding:9px 16px max(13px,env(safe-area-inset-bottom));font-size:10px;color:#667;text-align:center}.hidden{display:none!important}@media(orientation:landscape) and (max-height:520px){.app{width:min(100%,760px)}.top{position:relative}.main{padding:11px}.card{padding:14px}.answers{grid-template-columns:1fr 1fr}h1{font-size:23px}}@media(max-width:350px){.main{padding:10px}.card{padding:14px}h1{font-size:24px}.answer{font-size:14px}.traits{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo"><i></i>APTIV<i></i></div><div><div class="tag">BEREICHS-FINDER</div><div class="counter" id="counter"></div></div></div><div class="bar"><span id="progress"></span></div></header><main class="main" id="game"></main><footer class="footer">Orientierungsspiel für die Ausbildungsmesse · keine Eignungsdiagnostik</footer></div><canvas id="shot" class="hidden" width="1080" height="1350"></canvas>
<script>
const A={hr:'HR',el:'Elektronik',me:'Mechanik',la:'Lagerlogistik',ek:'Einkauf',qu:'Qualität',pr:'Produktion'};
const desc={hr:'Du arbeitest gern mit Menschen, kommunizierst klar und organisierst verlässlich.',el:'Du denkst technisch, analysierst Signale und gehst Fehlern systematisch auf den Grund.',me:'Du verstehst gern, wie Bauteile zusammenwirken, und packst praktisch mit an.',la:'Du behältst Waren, Wege und Termine im Blick und sorgst für einen sauberen Materialfluss.',ek:'Du vergleichst Angebote, verhandelst sachlich und findest wirtschaftliche Lösungen.',qu:'Du arbeitest genau, prüfst Ursachen und möchtest, dass Prozesse zuverlässig funktionieren.',pr:'Du magst klare Abläufe, Teamarbeit und sichtbare Ergebnisse im laufenden Betrieb.'};
const Q=[
{k:'Interesse',w:40,q:'Welche Aufgabe würdest du bei einem Projekttag zuerst wählen?',o:[['Ein Team organisieren und Ansprechpartner sein','hr'],['Eine Sensorschaltung aufbauen','el'],['Eine mechanische Baugruppe montieren','me'],['Material bereitstellen und Wege planen','la']]},
{k:'Interesse',w:40,q:'Was klingt für dich am spannendsten?',o:[['Bewerbungsgespräche vorbereiten','hr'],['Fehler in einer Platine finden','el'],['Werkzeuge und Bauteile praktisch einsetzen','me'],['Lieferanten und Preise vergleichen','ek']]},
{k:'Interesse',w:40,q:'Wo würdest du bei einer Werksführung am längsten stehen bleiben?',o:[['An einer automatisierten Montagelinie','pr'],['Im Prüflabor','qu'],['Bei der Warenannahme und Kommissionierung','la'],['Bei Steuergeräten und Messplätzen','el']]},
{k:'Interesse',w:40,q:'Welche Herausforderung motiviert dich am meisten?',o:[['Menschen passend einsetzen und unterstützen','hr'],['Die beste Kondition für ein Bauteil finden','ek'],['Eine Maschine wieder zum Laufen bringen','me'],['Einen Prozess stabil und fehlerfrei machen','qu']]},
{k:'Interesse',w:40,q:'Welche Art von Ergebnis macht dich besonders zufrieden?',o:[['Ein gutes Gespräch mit einer klaren Lösung','hr'],['Eine funktionierende elektrische Schaltung','el'],['Eine korrekt montierte Baugruppe','me'],['Eine pünktliche, vollständige Lieferung','la']]},
{k:'Interesse',w:40,q:'Welche Rolle würdest du in einem neuen Team übernehmen?',o:[['Absprachen und Stimmung koordinieren','hr'],['Technische Details analysieren','el'],['Praktische Umsetzung übernehmen','me'],['Aufgaben, Material und Reihenfolge planen','pr']]},
{k:'Interesse',w:40,q:'Welches Thema würdest du freiwillig vertiefen?',o:[['Arbeitsrecht und Personalentwicklung','hr'],['Strom, Sensorik und Steuerungen','el'],['Kräfte, Werkstoffe und Maschinen','me'],['Bestände, Transport und Warenfluss','la']]},
{k:'Interesse',w:40,q:'Was wäre für dich ein interessantes Tagesziel?',o:[['Drei gute Kandidatenprofile auswählen','hr'],['Einen günstigeren Lieferweg vereinbaren','ek'],['Eine Fehlerursache eindeutig nachweisen','qu'],['Den Produktionsplan zuverlässig erfüllen','pr']]},
{k:'Arbeitsweise',w:35,q:'Eine Aufgabe ist unklar. Was machst du zuerst?',o:[['Mit den Beteiligten sprechen und Erwartungen klären','hr'],['Messwerte und technische Unterlagen prüfen','el'],['Das Bauteil ansehen und die Funktion nachvollziehen','me'],['Ablauf, Bestand und Termin im System prüfen','la']]},
{k:'Arbeitsweise',w:35,q:'Bei einer Gruppenaufgabe bist du meistens die Person, die ...',o:[['auf gute Zusammenarbeit achtet','hr'],['Zahlen und Signale logisch auswertet','el'],['den praktischen Aufbau übernimmt','me'],['Material und Reihenfolge organisiert','pr']]},
{k:'Arbeitsweise',w:35,q:'Zwei Angebote erfüllen die Anforderungen. Wie entscheidest du?',o:[['Preis, Qualität, Lieferzeit und Risiko vergleichen','ek'],['Das Team abstimmen lassen','hr'],['Beide Bauteile praktisch zerlegen','me'],['Nur das billigste Angebot wählen','ek']]},
{k:'Arbeitsweise',w:35,q:'Du entdeckst einen wiederkehrenden Fehler. Was liegt dir am ehesten?',o:[['Ursache mit Daten eingrenzen und Maßnahme dokumentieren','qu'],['Den Fehler schnell übergehen','pr'],['Die beteiligten Personen einzeln befragen','hr'],['Nur das defekte Teil austauschen','me']]},
{k:'Arbeitsweise',w:35,q:'Was beschreibt deine bevorzugte Arbeitsumgebung?',o:[['Abwechslungsreich mit vielen Gesprächen','hr'],['Ruhig, analytisch und technisch','el'],['Praktisch mit Werkzeug und Bewegung','me'],['Strukturiert mit Waren, Listen und Terminen','la']]},
{k:'Arbeitsweise',w:35,q:'Bei Zeitdruck hilft dir am meisten ...',o:[['Prioritäten mit dem Team klar absprechen','hr'],['systematisch Schritt für Schritt messen','el'],['direkt praktisch anfangen und nachjustieren','me'],['Material und Aufträge sauber priorisieren','la']]},
{k:'Arbeitsweise',w:35,q:'Welche Stärke trifft am ehesten auf dich zu?',o:[['Einfühlungsvermögen und Kommunikation','hr'],['Logik und technisches Verständnis','el'],['Handgeschick und räumliches Denken','me'],['Ordnung und Überblick','la']]},
{k:'Arbeitsweise',w:35,q:'Was prüfst du vor dem Start einer Serienfertigung besonders gern?',o:[['Ob Prüfmerkmale und Grenzwerte eingehalten werden','qu'],['Ob Material, Personal und Takt bereitstehen','pr'],['Ob der Lieferant noch Rabatt gibt','ek'],['Ob alle ihren Urlaub eingetragen haben','hr']]},
{k:'Arbeitsweise',w:35,q:'Eine Lieferung verspätet sich. Welche Aufgabe reizt dich?',o:[['Lieferanten kontaktieren und Alternative verhandeln','ek'],['Bestände prüfen und Materialfluss neu planen','la'],['Produktionsreihenfolge anpassen','pr'],['Qualitätsprüfung verschieben','qu']]},
{k:'Arbeitsweise',w:35,q:'Wie gehst du mit Regeln und Standards um?',o:[['Ich erkläre sie verständlich und fair','hr'],['Ich nutze sie für sichere technische Arbeit','el'],['Ich setze sie präzise am Werkstück um','me'],['Ich kontrolliere und verbessere ihre Einhaltung','qu']]},
{k:'Vorwissen',w:25,q:'Wozu dient eine elektrische Sicherung?',o:[['Sie schützt Leitung und Anlage vor zu hohem Strom','el'],['Sie erhöht die Spannung','me'],['Sie speichert Bestände','la'],['Sie bewertet Lieferanten','ek']]},
{k:'Vorwissen',w:25,q:'Was bedeutet Kommissionieren?',o:[['Waren für einen Auftrag zusammenstellen','la'],['Mitarbeiter einstellen','hr'],['Maschinen elektrisch absichern','el'],['Preise buchen','ek']]},
{k:'Vorwissen',w:25,q:'Welche Größe wird typischerweise in Volt angegeben?',o:[['Elektrische Spannung','el'],['Drehmoment','me'],['Gewicht','la'],['Ausschussquote','qu']]},
{k:'Vorwissen',w:25,q:'Was ist bei einer Wareneingangsprüfung besonders wichtig?',o:[['Menge, Identität und Zustand kontrollieren','la'],['Nur die Farbe des Kartons ansehen','qu'],['Direkt alles in die Produktion geben','pr'],['Nur den Preis prüfen','ek']]},
{k:'Vorwissen',w:25,q:'Wozu dient ein Drehmomentschlüssel?',o:[['Schrauben mit vorgegebener Kraftwirkung anziehen','me'],['Spannung messen','el'],['Bestände zählen','la'],['Arbeitszeiten erfassen','hr']]},
{k:'Vorwissen',w:25,q:'Was zeigt eine Ausschussquote?',o:[['Anteil nicht verwendbarer Teile','qu'],['Anzahl der Bewerbungen','hr'],['Höhe der Spannung','el'],['Länge eines Transportwegs','la']]},
{k:'Vorwissen',w:25,q:'Was gehört zu einer sachlichen Lieferantenbewertung?',o:[['Qualität, Preis, Liefertreue und Risiko','ek'],['Nur persönliche Sympathie','hr'],['Nur die Entfernung','la'],['Nur die Farbe der Produkte','pr']]},
{k:'Vorwissen',w:25,q:'Was ist ein Produktionsplan?',o:[['Festgelegte Reihenfolge und Menge von Fertigungsaufträgen','pr'],['Liste privater Termine','hr'],['Schaltplan eines Sensors','el'],['Prüfbericht ohne Termine','qu']]},
{k:'Vorwissen',w:25,q:'Warum werden Prüfergebnisse dokumentiert?',o:[['Damit Qualität und Ursachen nachvollziehbar sind','qu'],['Damit Lagerplätze frei bleiben','la'],['Damit Spannung entsteht','el'],['Damit Schrauben fester werden','me']]},
{k:'Vorwissen',w:25,q:'Welche Aufgabe gehört typischerweise zu HR?',o:[['Onboarding und Personalbetreuung','hr'],['Elektrische Widerstände messen','el'],['Paletten kommissionieren','la'],['Bauteile fräsen','me']]}
];
let questions=[],idx=0,scores={},answered=0;const game=document.getElementById('game'),progress=document.getElementById('progress'),counter=document.getElementById('counter');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function resetScores(){scores={};Object.keys(A).forEach(x=>scores[x]={Interesse:0,Arbeitsweise:0,Vorwissen:0,total:0,count:0})}
function start(){questions=shuffle(Q).slice(0,24).map(x=>({...x,o:shuffle(x.o)}));idx=0;answered=0;resetScores();showQ()}
function showQ(){const q=questions[idx];progress.style.width=(idx/questions.length*100)+'%';counter.textContent=`${idx+1} / ${questions.length}`;game.innerHTML=`<section class="card"><span class="kind">${q.k}</span><div class="eyebrow">Frage ${idx+1}</div><h2>${q.q}</h2><div class="answers">${q.o.map((o,i)=>`<button class="answer" onclick="choose('${o[1]}')"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o[0]}</span></button>`).join('')}</div></section>`}
function choose(area){const q=questions[idx];scores[area][q.k]+=q.w;scores[area].count++;answered++;idx++;if(idx<questions.length)showQ();else finish()}
function finish(){progress.style.width='100%';counter.textContent='Auswertung';Object.keys(scores).forEach(a=>{let s=scores[a];s.total=s.Interesse+s.Arbeitsweise+s.Vorwissen});const ranked=Object.keys(scores).sort((a,b)=>scores[b].total-scores[a].total);const top=ranked.slice(0,3), max=Math.max(...top.map(a=>scores[a].total),1);const profile=getProfile(top);window.lastResult={top,profile,max};game.innerHTML=`<section class="card resultHero"><div class="eyebrow">Dein Interessenprofil</div><div class="profile">${profile}</div><p>${desc[top[0]]}</p></section><section class="card"><div class="eyebrow">Diese Bereiche solltest du dir ansehen</div>${top.map((a,i)=>`<div class="topArea"><div class="rank">${i+1}</div><div style="flex:1"><div class="areaName">${A[a]}</div><div class="scorebar"><span style="width:${Math.round(scores[a].total/max*100)}%"></span></div></div></div>`).join('')}<div class="traits"><div class="trait">Interessen<br>${sumType(top,'Interesse')}</div><div class="trait">Arbeitsweise<br>${sumType(top,'Arbeitsweise')}</div><div class="trait">Vorwissen<br>${sumType(top,'Vorwissen')}</div></div><div class="notice">Das Ergebnis ist eine Orientierung für Gespräche am Stand. Es ist keine abschließende Eignungsbewertung.</div><button class="btn" onclick="saveCard()">Ergebnis als Bild speichern</button><button class="btn light" onclick="start()">Neu starten</button></section>`}
function sumType(top,t){const x=top.map(a=>scores[a][t]);const m=Math.max(...x);return m?`${Math.round(x[0]/m*100)} %`:'0 %'}
function getProfile(r){const x=r[0],y=r[1];if(['el','me','qu'].includes(x))return y==='pr'?'Technisch & umsetzungsstark':'Technisch & analytisch';if(['hr'].includes(x))return 'Kommunikativ & organisiert';if(['la','pr'].includes(x))return 'Strukturiert & praktisch';if(x==='ek')return 'Kaufmännisch & lösungsorientiert';return 'Vielseitig & zuverlässig'}
function rounded(c,x,y,w,h,r,fill){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill()}
function saveCard(){const c=document.getElementById('shot'),x=c.getContext('2d'),R=window.lastResult;x.fillStyle='#F3F6F7';x.fillRect(0,0,1080,1350);rounded(x,55,50,970,300,32,'#1A1A2E');x.fillStyle='#B7D1CF';x.font='bold 28px Arial';x.fillText('APTIV · DEIN INTERESSENPROFIL',105,115);x.fillStyle='#FFFFFF';x.font='bold 55px Arial';wrap(x,R.profile,105,190,850,65);x.fillStyle='#F84018';x.fillRect(105,300,210,10);x.fillStyle='#1A1A2E';x.font='bold 30px Arial';x.fillText('DIESE BEREICHE SOLLTEST DU DIR ANSEHEN',65,420);R.top.forEach((a,i)=>{let y=475+i*190;rounded(x,65,y,950,150,25,'#FFFFFF');rounded(x,90,y+31,88,88,20,'#F84018');x.fillStyle='#FFFFFF';x.font='bold 45px Arial';x.textAlign='center';x.fillText(i+1,134,y+90);x.textAlign='left';x.fillStyle='#1A1A2E';x.font='bold 39px Arial';x.fillText(A[a],210,y+65);x.fillStyle='#657076';x.font='24px Arial';wrap(x,desc[a],210,y+103,740,29)});x.fillStyle='#657076';x.font='22px Arial';wrap(x,'Orientierung für dein Gespräch am Aptiv-Stand. Keine abschließende Eignungsbewertung.',65,1120,940,30);x.fillStyle='#1A1A2E';x.font='bold 24px Arial';x.fillText('APTIV BEREICHS-FINDER',65,1270);const link=document.createElement('a');link.download='mein_aptiv_interessenprofil.png';link.href=c.toDataURL('image/png');link.click()}
function wrap(c,t,x,y,w,l){const words=t.split(' ');let line='';for(const word of words){const test=line+word+' ';if(c.measureText(test).width>w&&line){c.fillText(line,x,y);line=word+' ';y+=l}else line=test}c.fillText(line,x,y)}
progress.style.width='0';counter.textContent='';game.innerHTML=`<section class="card"><div class="eyebrow">Ausbildungsmesse</div><h1>Welcher Bereich passt zu dir?</h1><p>Beantworte 24 zufällig gemischte Fragen zu deinen Interessen, deiner Arbeitsweise und deinem Vorwissen.</p><div class="chips"><span class="chip">7 Bereiche</span><span class="chip">ca. 6 Minuten</span><span class="chip">Persönliche Auswertung</span></div><button class="btn" onclick="start()">Bereichs-Finder starten</button></section><section class="card"><h2>So funktioniert es</h2><p>Es gibt kein Bestehen oder Durchfallen. Wähle jeweils die Antwort, die am besten zu dir passt. Am Ende erhältst du drei Bereiche als Gesprächsempfehlung und kannst dein Ergebnis als Bild speichern.</p></section>`;
</script></body></html>
